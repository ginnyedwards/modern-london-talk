<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 0; padding: 20px; background: #f9f9f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; }
        
        /* Slideshow CSS */
        .slideshow-container { position: relative; margin: auto; }
        .mySlides { display: none; }
        img { width: 100%; border-radius: 8px; vertical-align: middle; }
        .prev, .next { cursor: pointer; position: absolute; top: 50%; width: auto; padding: 16px; margin-top: -22px; color: white; font-weight: bold; font-size: 18px; background: rgba(0,0,0,0.3); border-radius: 0 3px 3px 0; user-select: none; text-decoration: none; }
        .next { right: 0; border-radius: 3px 0 0 3px; }
        
        .btn { display: block; text-align: center; background: #000; color: #fff; padding: 15px; text-decoration: none; border-radius: 8px; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <p style="color: grey;">Stop 1 of 16</p>
    <h1>10 Dorchester Drive</h1>
    </div>

    <!-- SLIDESHOW START -->
    <div class="slideshow-container">
        <div class="mySlides"><img src="images/stop1-1.jpg"></div>
        <div class="mySlides"><img src="images/stop1-2.jpg"></div>
        <div class="mySlides"><img src="images/stop1-3.jpg"></div>

        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>
    </div>
    <!-- SLIDESHOW END -->

    <div class="content">
        <p>This is where your story for Stop 1 goes.</p>
    </div>

    <a href="stop2.html" class="btn">Next Stop →</a>
    <a href="index.html" style="display:block; text-align:center; margin-top:10px; color:grey; text-decoration:none;">← Back to Menu</a>
</div>

<script>
    let slideIndex = 1;
    showSlides(slideIndex);
    function plusSlides(n) { showSlides(slideIndex += n); }
    function showSlides(n) {
        let i;
        let slides = document.getElementsByClassName("mySlides");
        if (n > slides.length) {slideIndex = 1}
        if (n < 1) {slideIndex = slides.length}
        for (i = 0; i < slides.length; i++) { slides[i].style.display = "none"; }
        slides[slideIndex-1].style.display = "block";
    }
    <!-- Replace the 00.000 coordinates with the actual location of the stop -->
    <a href="https://www.google.com/maps/search/?api=1&query=51.4623°,0.1086°" class="btn btn-map"> Open in Google Maps</a>
</script>

</body>
</html>
